packages:
  - 'apps/*'
  - 'packages/*'

# @cheolubak/* 는 각 package.json에 버전 범위(^0.1.0)로 개별 선언한다.
# link: 상대경로였을 때는 pnpm이 catalog 항목의 link: 프로토콜을 거부해
# (ERR_PNPM_CATALOG_ENTRY_INVALID_SPEC) 여기 넣을 수 없었다. 지금은
# 버전 범위라 넣을 수 있지만 아직 그렇게 바꾸지 않았다.
catalog:
  next: ^16.2.12
  react: ^19.2.4
  react-dom: ^19.2.4
  typescript: ^5.7.3
  tailwindcss: ^4
  '@tailwindcss/postcss': ^4
  '@next/eslint-plugin-next': ^16.0.0
  eslint-plugin-jsx-a11y: ^6.10.0
  eslint-plugin-react-hooks: ^7.1.0
  vitest: ^2.1.0
  jsdom: ^25.0.0

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
