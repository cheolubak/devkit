name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: 버전 커밋·태그 push 용, packages: 게시용.
# GitHub Actions 의 기본 GITHUB_TOKEN 에 둘 다 줄 수 있어 PAT 이 필요 없다.
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # workflow_dispatch 는 push 와 달리 브랜치 제한이 없다 — 수동 실행을
    # main 이 아닌 브랜치에서 하면 그 브랜치에서 버전을 올리고 게시해버린다.
    if: github.ref == 'refs/heads/main'
    steps:
      # v6 부터 자격증명이 .git/config 가 아니라 $RUNNER_TEMP 아래 별도 파일에
      # 들어간다. 아래 "커밋과 태그" 의 git push 는 그대로 동작한다 — 그 변경이
      # 깨는 것은 Docker container action 안에서 git 을 부르는 경로뿐이다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 지난 릴리스 태그 이후를 읽어야 한다

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # .ts 를 네이티브로 실행한다(빌드 없이 릴리스 스크립트 호출)
          cache: pnpm
          # 게시 인증에 필요하다 — 없으면 .npmrc 가 안 생겨 pnpm publish 가
          # //npm.pkg.github.com/:_authToken 을 못 찾고 401 로 실패한다.
          #
          # setup-node v7 부터 더미 NODE_AUTH_TOKEN 을 내보내지 않는다. 그래서
          # 아래 install 단계(토큰을 주지 않는다)에서 pnpm 이 "Failed to replace
          # env in config: ${NODE_AUTH_TOKEN}" 을 **경고로** 남긴다 — 설치는
          # 정상 진행된다(실측). 토큰은 게시 단계에만 주는 현재 설계가 맞으므로
          # 그 경고를 없애려고 잡 전체에 토큰을 노출시키지 않는다.
          registry-url: https://npm.pkg.github.com
          scope: '@cheolubak'

      - run: pnpm install --frozen-lockfile

      - name: 릴리스 대상 판정
        id: decide
        run: |
          set -euo pipefail
          CONFIG_SINCE=$(git tag --list 'config-v*' --sort=-v:refname | head -1)
          CLI_SINCE=$(git tag --list 'cli-v*' --sort=-v:refname | head -1)

          # 태그가 없으면 decide.ts 는 전체 이력으로 조용히 후퇴한다(그런
          # 용도의 인자 처리다) — 여기서는 "기준선을 못 찾았다"와 "기준선이
          # 원래 없다"를 구분할 수 없으므로 던진다. 누군가 태그를 지워도
          # 전체 이력을 읽어 전 패키지가 통째로 올라가는 사고를 막는다.
          if [ -z "$CONFIG_SINCE" ]; then
            echo "::error::config 기준 태그(config-v*)가 없다 — 부트스트랩 태그가 origin 에 있는지 확인하라"
            exit 1
          fi
          if [ -z "$CLI_SINCE" ]; then
            echo "::error::cli 기준 태그(cli-v*)가 없다 — 부트스트랩 태그가 origin 에 있는지 확인하라"
            exit 1
          fi

          node packages/devkit-cli/src/release/decide.ts "$CONFIG_SINCE" > /tmp/config-decide.json
          node packages/devkit-cli/src/release/decide.ts "$CLI_SINCE" > /tmp/cli-decide.json

          # 파일을 거쳐 파싱한다 — stdout 을 파이프로 바로 넘기면 청크가
          # 나뉠 때 부분 버퍼를 JSON.parse 할 수 있다. config/cli 필드가
          # 없으면(decide.ts 출력이 깨진 것) 빈 문자열로 읽지 않고 던진다 —
          # 그러지 않으면 "판정 실패"와 "릴리스 없음"이 구분 안 되는 채로
          # 조용히 녹색으로 끝난다.
          CONFIG=$(node -e '
            const d = JSON.parse(require("node:fs").readFileSync("/tmp/config-decide.json", "utf8"));
            if (!("config" in d)) throw new Error("decide.ts 출력에 config 필드가 없다");
            process.stdout.write(d.config ?? "");
          ')
          CLI=$(node -e '
            const d = JSON.parse(require("node:fs").readFileSync("/tmp/cli-decide.json", "utf8"));
            if (!("cli" in d)) throw new Error("decide.ts 출력에 cli 필드가 없다");
            process.stdout.write(d.cli ?? "");
          ')

          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
          echo "판정 — config: '${CONFIG:-없음}', cli: '${CLI:-없음}'"

      - name: 검증
        if: steps.decide.outputs.config != '' || steps.decide.outputs.cli != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # e2e 가 생성물의 .npmrc 에 이 이름으로 심는다
        run: |
          pnpm build
          pnpm test
          pnpm typecheck
          pnpm lint:ox
          pnpm lint:es
          pnpm test:e2e

      - name: 버전 갱신
        if: steps.decide.outputs.config != '' || steps.decide.outputs.cli != ''
        id: bump
        run: |
          if [ -n "${{ steps.decide.outputs.config }}" ]; then
            V=$(node packages/devkit-cli/src/release/apply.ts config "${{ steps.decide.outputs.config }}")
            echo "config_version=$V" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ steps.decide.outputs.cli }}" ]; then
            V=$(node packages/devkit-cli/src/release/apply.ts cli "${{ steps.decide.outputs.cli }}")
            echo "cli_version=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: 게시
        if: steps.decide.outputs.config != '' || steps.decide.outputs.cli != ''
        env:
          # pnpm/npm 은 인증에 //npm.pkg.github.com/:_authToken 설정만 본다 —
          # GITHUB_TOKEN 환경변수는 참조하지 않는다. setup-node 의 registry-url
          # 이 써 준 .npmrc 가 이 이름을 읽는다.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -r publish --no-git-checks --access public

      # 게시가 성공한 뒤에만 커밋한다 — 게시가 실패하면 저장소가
      # "올렸다고 하는데 레지스트리엔 없는" 상태로 남지 않는다.
      - name: 커밋과 태그
        if: steps.decide.outputs.config != '' || steps.decide.outputs.cli != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # apply.ts 가 실제로 건드리는 파일만 스테이징한다 — git add -A 는
          # pnpm build/test/test:e2e/publish 를 거친 워킹트리 전체를 쓸어
          # 담아, gitignore 되지 않는 산출물이 하나만 생겨도 build: 접두
          # 커밋으로 main 에 들어가고(그 접두는 patch 를 부른다) 다음 판정에
          # 영향을 준다.
          git add packages/*/package.json packages/devkit-cli/src/ops/registry-deps.ts
          git commit -m "build: 릴리스 버전을 올린다 [skip ci]"
          # annotated 태그여야 한다 — git push --follow-tags 는 정의상
          # annotated 태그만 민다. lightweight 로 만들면 로컬에서만 생기고
          # origin 에는 영영 안 나가, 다음 판정이 태그를 못 찾아 전체 이력으로
          # 후퇴한다(부트스트랩 태그가 이 문제로 origin 에 없었다).
          if [ -n "${{ steps.bump.outputs.config_version }}" ]; then
            git tag -a -m "release" "config-v${{ steps.bump.outputs.config_version }}"
          fi
          if [ -n "${{ steps.bump.outputs.cli_version }}" ]; then
            git tag -a -m "release" "cli-v${{ steps.bump.outputs.cli_version }}"
          fi
          git push --follow-tags
